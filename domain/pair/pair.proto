syntax = "proto3";

package pair;

import "buf/validate/validate.proto";
import "sologenic/com-fs-asset-model/domain/denom/denom.proto";

option go_package = "github.com/sologenic/com-fs-asset-model/domain/pair;pair";

message Pair {
    denom.Denom Base = 1 [
        (buf.validate.field).required = true
    ];
    denom.Denom Quote = 2 [
        (buf.validate.field).required = true
    ];
}